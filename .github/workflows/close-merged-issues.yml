name: Close merged issues
on:
  pull_request:
    branches: [develop]
    types: [closed]
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A merged PR's github.sha is the base branch merge commit; never run its head ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { default: closeMergedIssues } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/close-merged-issues.mjs`).href);
            await closeMergedIssues({ github, context, core });
