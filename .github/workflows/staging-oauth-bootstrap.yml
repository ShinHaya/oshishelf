name: Staging OAuth bootstrap
on:
  push:
    branches: [issue-49-staging-terraform]
    paths:
      - .github/workflows/staging-oauth-bootstrap.yml
      - infra/staging/iap-oauth.tf
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  oauth:
    if: github.repository == 'ShinHaya/oshishelf' && github.actor_id == '23278980'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.STAGING_PROJECT_ID }}
      TF_VAR_app_origin: ${{ vars.STAGING_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_TERRAFORM_ACCOUNT }}
      - run: terraform -chdir=infra/staging init -input=false -backend-config="bucket=${TF_VAR_project_id}-tfstate" -backend-config="prefix=staging"
      - name: Read existing image without redeploying it
        run: |
          IMAGE=$(terraform -chdir=infra/staging state pull | jq -er '.resources[] | select(.type == "google_cloud_run_v2_service" and .name == "app") | .instances[0].attributes.template[0].containers[0].image')
          echo "TF_VAR_image=$IMAGE" >> "$GITHUB_ENV"
      - name: Plan initial OAuth attachment only
        env:
          TF_VAR_iap_oauth_client_secret: ${{ secrets.STAGING_IAP_OAUTH_CLIENT_SECRET }}
        run: |
          umask 077
          terraform -chdir=infra/staging plan -input=false -lock-timeout=5m -target=google_iap_settings.oauth -out=/tmp/oauth.tfplan
          terraform -chdir=infra/staging show -json /tmp/oauth.tfplan > /tmp/oauth-plan.json
          jq -e '[.resource_changes[] | select(.mode == "managed" and .change.actions != ["no-op"])] | length == 1 and all(.address == "google_iap_settings.oauth[0]" and .change.actions == ["create"])' /tmp/oauth-plan.json > /dev/null
      - name: Apply approved OAuth attachment
        run: terraform -chdir=infra/staging apply -input=false /tmp/oauth.tfplan
      - name: Remove local plan files
        if: always()
        run: rm -f /tmp/oauth.tfplan /tmp/oauth-plan.json
