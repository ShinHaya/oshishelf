name: Staging
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ShinHaya/oshishelf' && github.actor_id == '23278980' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 23278980))
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
  deploy:
    needs: verify
    # Privileged workflow: only the operator's same-repository PRs may run.
    if: github.repository == 'ShinHaya/oshishelf' && github.actor_id == '23278980' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == 23278980))
    permissions:
      contents: read
      id-token: write
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.STAGING_PROJECT_ID }}
      TF_VAR_region: asia-northeast1
      TF_VAR_app_origin: ${{ vars.STAGING_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_TERRAFORM_ACCOUNT }}
      - run: terraform -chdir=infra/staging init -input=false -backend-config="bucket=${TF_VAR_project_id}-tfstate" -backend-config="prefix=staging"
      - name: Read public Firebase build configuration
        run: |
          terraform -chdir=infra/staging output -json firebase_web_config > /tmp/firebase.json
          jq -r '"NEXT_PUBLIC_FIREBASE_API_KEY=\(.api_key)\nNEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=\(.auth_domain)\nNEXT_PUBLIC_FIREBASE_PROJECT_ID=\(.project_id)\nNEXT_PUBLIC_FIREBASE_APP_ID=\(.app_id)"' /tmp/firebase.json >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_DEPLOY_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build staging image
        run: |
          gcloud auth configure-docker "${TF_VAR_region}-docker.pkg.dev" --quiet
          IMAGE="${TF_VAR_region}-docker.pkg.dev/${TF_VAR_project_id}/staging/app:${GITHUB_RUN_ID}"
          docker build --pull --build-arg GOOGLE_CLOUD_PROJECT="$TF_VAR_project_id" --build-arg NEXT_PUBLIC_FIREBASE_API_KEY --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID --build-arg NEXT_PUBLIC_FIREBASE_APP_ID -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "TF_VAR_image=$DIGEST" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_TERRAFORM_ACCOUNT }}
      - run: terraform -chdir=infra/staging plan -input=false -lock-timeout=5m -out=/tmp/staging.tfplan
        env:
          TF_VAR_iap_oauth_client_secret: ${{ secrets.STAGING_IAP_OAUTH_CLIENT_SECRET }}
      - run: terraform -chdir=infra/staging apply -input=false /tmp/staging.tfplan
      - name: Capture Terraform outputs
        run: |
          terraform -chdir=infra/staging output -json uri > /tmp/uri.json
          terraform -chdir=infra/staging output -json ai_test_account > /tmp/ai_test_account.json
          echo "APP_ORIGIN=$(jq -r '.' /tmp/uri.json)" >> "$GITHUB_ENV"
          echo "AI_TEST_SA=$(jq -r '.' /tmp/ai_test_account.json)" >> "$GITHUB_ENV"
      - name: Capture Cloud Run deployment info
        run: |
          gcloud run services describe oshishelf-staging --region=asia-northeast1 --project="${TF_VAR_project_id}" --format=json > /tmp/cloud-run-service.json
          DEPLOYED_IMAGE=$(jq -r '.spec.template.spec.containers[0].image' /tmp/cloud-run-service.json)
          echo "DEPLOYED_IMAGE=${DEPLOYED_IMAGE}" >> "$GITHUB_ENV"
      - name: Screen validation test
        env:
          APP_ORIGIN: ${{ env.APP_ORIGIN }}
          PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
          AI_TEST_SA_EMAIL: ${{ env.AI_TEST_SA }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOYED_IMAGE: ${{ env.DEPLOYED_IMAGE }}
          BUILD_DIGEST: ${{ env.TF_VAR_image }}
        run: node .github/scripts/staging-screen-test.mjs
      - name: Record test results
        if: always()
        run: |
          echo "## Staging Deployment Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target SHA**: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **App URL**: ${{ env.APP_ORIGIN }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID**: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screen Validation Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/screen-test-results.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/screen-test-results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test results not available" >> "$GITHUB_STEP_SUMMARY"
          fi
