<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526174"/></marker></defs>
<rect width="1600" height="1020" fill="#f7f9fc"/>

<text x="40" y="55" font-size="34" font-weight="700" fill="#263449">推し棚 OshiShelf / システムアーキテクチャ</text>
<text x="40" y="89" font-size="21" font-weight="400" fill="#263449">購入作品を下書きにまとめ、本人が選んで公開するSNS。6つのAIの役割で趣味のつながりを支援</text>
<rect x="395" y="125" width="1165" height="833" rx="16" fill="#eef4ff" stroke="#4285f4" stroke-width="2"/>
<text x="417" y="158" font-size="23" font-weight="700" fill="#263449">Google Cloud</text>
<rect x="417" y="180" width="680" height="572" rx="16" fill="#fff" stroke="#4285f4" stroke-width="2"/>
<text x="439" y="215" font-size="26" font-weight="700" fill="#263449">Cloud Run / Next.js 16</text>
<text x="439" y="245" font-size="19" font-weight="400" fill="#263449">App Router / Server Actions：認証、所有者、公開範囲を検証</text>
<rect x="439" y="267" width="636" height="140" rx="16" fill="#fcf1e8" stroke="#ced8e5" stroke-width="2"/>
<text x="459" y="301" font-size="23" font-weight="700" fill="#263449">取り込みとプライバシーガード（Gemini）</text>
<text x="459" y="335" font-size="18" font-weight="400" fill="#263449">商品カード / URL / スクリーンショット / テキストを抽出</text>
<text x="459" y="363" font-size="18" font-weight="400" fill="#263449">分類と公開範囲の提案 → 下書き保存 → 本人が確認して公開</text>
<text x="439" y="442" font-size="21" font-weight="700" fill="#263449">ADK：モデルがツールを選んで棚の探索や調査を実行</text>
<rect x="439" y="462" width="308" height="111" rx="16" fill="#fceef3" stroke="#ced8e5" stroke-width="2"/>
<text x="459" y="496" font-size="23" font-weight="700" fill="#263449">プロフィール</text>
<text x="459" y="530" font-size="18" font-weight="400" fill="#263449">全体公開の棚から下書き</text>
<text x="459" y="558" font-size="18" font-weight="400" fill="#263449">本人が承認して反映</text>
<rect x="767" y="462" width="308" height="111" rx="16" fill="#fceef3" stroke="#ced8e5" stroke-width="2"/>
<text x="787" y="496" font-size="23" font-weight="700" fill="#263449">相性マッチング</text>
<text x="787" y="530" font-size="18" font-weight="400" fill="#263449">2人の全体公開棚を比較</text>
<text x="787" y="558" font-size="18" font-weight="400" fill="#263449">共通点、おすすめ、話しかけ例</text>
<rect x="439" y="589" width="308" height="111" rx="16" fill="#fceef3" stroke="#ced8e5" stroke-width="2"/>
<text x="459" y="623" font-size="23" font-weight="700" fill="#263449">AI分身チャット</text>
<text x="459" y="657" font-size="18" font-weight="400" fill="#263449">相手の全体公開棚を検索</text>
<text x="459" y="685" font-size="18" font-weight="400" fill="#263449">作品リンク付きで回答</text>
<rect x="767" y="589" width="308" height="111" rx="16" fill="#fceef3" stroke="#ced8e5" stroke-width="2"/>
<text x="787" y="623" font-size="23" font-weight="700" fill="#263449">ウォッチャー</text>
<text x="787" y="657" font-size="18" font-weight="400" fill="#263449">価格と新作を調査して通知</text>
<text x="787" y="685" font-size="18" font-weight="400" fill="#263449">価格検証 / 検索と通知の上限</text>
<text x="439" y="730" font-size="19" font-weight="400" fill="#263449">ADKの行動ログをUIへ表示 / AI利用上限 / 一時エラーを再試行</text>
<rect x="1140" y="180" width="396" height="240" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="1160" y="214" font-size="23" font-weight="700" fill="#263449">Vertex AI / Gemini</text>
<text x="1160" y="248" font-size="18" font-weight="400" fill="#263449">2.5 Flash：探索、抽出、画像</text>
<text x="1160" y="276" font-size="18" font-weight="400" fill="#263449">Flash-Lite：分類、ガード</text>
<text x="1160" y="304" font-size="18" font-weight="400" fill="#263449">embedding-001：768次元</text>
<text x="1160" y="332" font-size="18" font-weight="400" fill="#263449">Google Search / URL Context</text>
<text x="1160" y="360" font-size="18" font-weight="400" fill="#263449">接続先は環境変数（既定global）</text>
<rect x="1140" y="445" width="396" height="167" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="1160" y="479" font-size="23" font-weight="700" fill="#263449">Firestore</text>
<text x="1160" y="513" font-size="18" font-weight="400" fill="#263449">棚、フォロー、通知、利用記録</text>
<text x="1160" y="541" font-size="18" font-weight="400" fill="#263449">嗜好ベクトル検索 / 監査ログ</text>
<text x="1160" y="569" font-size="18" font-weight="400" fill="#263449">クライアント直接アクセスを拒否</text>
<rect x="1140" y="637" width="396" height="115" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="1160" y="671" font-size="23" font-weight="700" fill="#263449">Firebase Authentication</text>
<text x="1160" y="705" font-size="18" font-weight="400" fill="#263449">IDトークン → セッションCookie</text>
<text x="1160" y="733" font-size="18" font-weight="400" fill="#263449">サーバーでセッション検証</text>
<rect x="40" y="180" width="310" height="225" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="60" y="214" font-size="23" font-weight="700" fill="#263449">ユーザーのブラウザ</text>
<text x="60" y="248" font-size="18" font-weight="400" fill="#263449">棚 / フィード / AIの行動ログ</text>
<text x="60" y="276" font-size="18" font-weight="400" fill="#263449">ブックマークレットで商品カード</text>
<text x="60" y="304" font-size="18" font-weight="400" fill="#263449">（リンク、周辺文、画像候補）</text>
<text x="60" y="332" font-size="18" font-weight="400" fill="#263449">を読み取り postMessage</text>
<text x="60" y="360" font-size="18" font-weight="400" fill="#263449">ショップの認証情報は渡さない</text>
<rect x="40" y="445" width="310" height="167" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="60" y="479" font-size="23" font-weight="700" fill="#263449">公開前に本人が確認</text>
<text x="60" y="513" font-size="18" font-weight="400" fill="#263449">下書きと公開範囲を確認</text>
<text x="60" y="541" font-size="18" font-weight="400" fill="#263449">自己紹介も編集して承認</text>
<text x="60" y="569" font-size="18" font-weight="400" fill="#263449">ショップのページ構造で差がある</text>
<rect x="40" y="637" width="310" height="115" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="60" y="671" font-size="23" font-weight="700" fill="#263449">外部ショップ</text>
<text x="60" y="705" font-size="18" font-weight="400" fill="#263449">楽天ブックス / Amazon / Steam</text>
<text x="60" y="733" font-size="18" font-weight="400" fill="#263449">公開商品ページ / 購入リンク先</text>
<rect x="417" y="811" width="680" height="135" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="437" y="845" font-size="23" font-weight="700" fill="#263449">Cloud Scheduler → /api/cron/watch</text>
<text x="437" y="879" font-size="18" font-weight="400" fill="#263449">OIDCの宛先とサービスアカウントを検証してウォッチャーを起動</text>
<text x="437" y="907" font-size="18" font-weight="400" fill="#263449">手動起動も可能。今回の動作確認は手動巡回（定期実行は未確認）</text>
<rect x="1140" y="811" width="396" height="135" rx="16" fill="#fff" stroke="#ced8e5" stroke-width="2"/>
<text x="1160" y="845" font-size="23" font-weight="700" fill="#263449">表示とAI入力の制御</text>
<text x="1160" y="879" font-size="18" font-weight="400" fill="#263449">他者の年齢制限作品は表示同意</text>
<text x="1160" y="907" font-size="18" font-weight="400" fill="#263449">AIは所有者同意＋識別情報を伏せる</text>
<text x="1160" y="935" font-size="18" font-weight="400" fill="#263449">公開向けAIは全体公開だけ</text>
<path d="M350 225H417" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="357" y="212" font-size="14" font-weight="400" fill="#263449">HTTPS</text>
<path d="M350 353H439" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="355" y="340" font-size="14" font-weight="400" fill="#263449">カード</text>
<path d="M1097 295H1140" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1097 530H1140" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1097 695H1140" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M1080 811H1117V650H1075" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1101" y="794" font-size="14" font-weight="400" fill="#263449">OIDC</text>
<path d="M417 720H378V695H350" fill="none" stroke="#526174" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="359" y="656" font-size="14" font-weight="400" fill="#263449">SSRF</text>
<text x="40" y="978" font-size="20" font-weight="400" fill="#263449">商品ページはsafeFetchText経由で取得。購入リンク /go/:id も公開範囲と年齢制限を検証してショップへ移動。</text>
</svg>
